<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu Tiên Đại Đạo - FULL CODE</title>
<style>
body{background:#0a0a1a;color:#cdd6f4;font-family:system-ui;margin:0;padding:10px}
.card{background:#151530;border:1px solid #3a3a6a;border-radius:12px;padding:12px;margin:8px 0}
button{padding:8px 12px;border-radius:8px;border:none;margin:4px;background:#4c6ef5;color:white;cursor:pointer}
button.green{background:#2b8a3e}button.secondary{background:#495057}
.badge{background:#7048e8;padding:2px 6px;border-radius:6px;font-size:12px}
.tab{display:none}.tab.active{display:block}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
</style>
</head>
<body>
<h2>Tu Tiên Đại Đạo - 19 Cảnh Giới - FULL</h2>
<div class="nav">
<button onclick="showTab('cult')">Tu Luyện</button>
<button onclick="showTab('battle')">Chiến Đấu</button>
<button onclick="showTab('world')">Khám Phá</button>
<button onclick="showTab('char')">Nhân Vật</button>
<button onclick="showTab('sect')">Tông Môn</button>
<button onclick="showTab('friends')">Đạo Hữu</button>
</div>

<div id="cult" class="tab active card">
<div id="charRealm" style="font-weight:bold;color:#a78bfa"></div>
<div id="cultivationStatus">Đang vận chuyển linh khí...</div>
<div>Tu vi: <span id="xp"></span>/<span id="needXP"></span> | Linh thạch: <span id="stones"></span></div>
<progress id="xpBar" value="0" max="100" style="width:100%"></progress>
<button onclick="cultivate(10)">Tu Luyện +10</button>
<button id="autoBtn" onclick="toggleAuto()">Auto</button>
<button onclick="usePill()">Đan Dược (<span id="pillCount"></span>)</button>
<button onclick="breakthrough()" style="background:#e67700">Đột Phá</button>
<div id="log" style="height:120px;overflow:auto;background:#0e0e23;padding:6px"></div>
</div>

<div id="battle" class="tab card"><h3>Chiến Đấu</h3><div id="monsterInfo">Chưa có quái</div><button onclick="findMonster()">Tìm Quái</button><button onclick="attackMonster()">Tấn Công</button><button onclick="useBattlePill()">Hồi Máu 50%</button></div>
<div id="world" class="tab card"><h3>Thế Giới</h3><div id="worldList"></div></div>
<div id="char" class="tab card"><h3>Nhân Vật</h3><input id="nameInput" placeholder="Đạo hiệu"><button onclick="changeName()">Đổi Tên</button><div>Power: <span id="charPower"></span> HP: <span id="charMaxHP"></span> Wins: <span id="wins"></span> Rep: <span id="reputation"></span></div><div id="realmList"></div><button onclick="exportSave()">Xuất Save</button><button onclick="resetGame()" style="background:#c92a2a">Reset</button></div>
<div id="sect" class="tab card"><h3>Tông Môn</h3><div id="sectList"></div></div>
<div id="friends" class="tab card"><h3>Đạo Hữu</h3><div id="friendList"></div><div id="chatLog" style="height:100px;overflow:auto;background:#0e0e23;padding:6px"></div><input id="chatInput" placeholder="Truyền âm..."><button onclick="sendChat()">Gửi</button><div id="leaderboard"></div></div>

<script>
const REALMS=["Phàm Nhân","Luyện Khí","Trúc Cơ","Kim Đan","Nguyên Anh","Hóa Thần","Luyện Hư","Hợp Thể","Đại Thừa","Độ Kiếp","Nhân Tiên","Địa Tiên","Thiên Tiên","Chân Tiên","Huyền Tiên","Kim Tiên","Tiên Vương","Tiên Tôn","Tiên Đế"];
const WORLDS=["Thanh Vân Sơn","U Minh Cốc","Tinh Thần Hải","Cửu Tiêu Thiên"];
const MONSTERS=[{name:"Yêu Thỏ",hp:50,power:5},{name:"Lang Yêu",hp:120,power:12},{name:"Hắc Hùng",hp:250,power:25},{name:"Giao Long",hp:500,power:50},{name:"Ma Tôn",hp:1000,power:100}];
const SECTS=[{name:"Thanh Vân Tông",bonus:10},{name:"Huyết Ảnh Tông",bonus:20},{name:"Thiên Kiếm Tông",bonus:30}];
const NPCS=[{name:"Lãng Vân",realm:5},{name:"Mộ Thanh",realm:8},{name:"Hàn Kiếm",realm:12},{name:"Tử Hà Tiên Tử",realm:15},{name:"Cổ Đạo Nhân",realm:18}];

let state = JSON.parse(localStorage.getItem("tuTienSave")||"null") || {name:"Đạo Hữu",realm:0,tier:1,xp:0,pills:5,stones:100,hp:100,wins:0,reputation:0,totalSeconds:0,breaks:0,auto:false,sect:null};

function needXP(){return state.realm*100 + state.tier*20 + 50;}
function maxHP(){return 100 + state.realm*50 + state.tier*10;}
function power(){return state.realm*20 + state.tier*5 + (state.sect!==null?SECTS[state.sect].bonus:0);}
function save(){localStorage.setItem("tuTienSave", JSON.stringify(state));}
function note(t){document.getElementById("log").innerHTML="<div>> "+t+"</div>"+document.getElementById("log").innerHTML;}
function render(){document.getElementById("xp").textContent=state.xp;document.getElementById("needXP").textContent=needXP();document.getElementById("xpBar").value=(state.xp/needXP())*100;document.getElementById("pillCount").textContent=state.pills;document.getElementById("stones").textContent=state.stones;document.getElementById("charRealm").textContent=REALMS[state.realm]+" tầng "+state.tier;document.getElementById("autoBtn").className=state.auto?"green":"secondary";renderCharacter();renderWorlds();renderSects();renderFriends();}
function showTab(id){document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));document.getElementById(id).classList.add("active");}
function cultivate(a){if(state.xp>=needXP()){document.getElementById("cultivationStatus").textContent="Tu vi đã đầy, hãy đột phá!";return;}state.xp=Math.min(needXP(),state.xp+a);if(state.xp>=needXP()){state.auto=false;note("Tu vi đầy, có thể đột phá!");}else note("Tu luyện +"+a);save();render();}
let autoTimer=null;function toggleAuto(){state.auto=!state.auto;if(state.auto){autoTimer=setInterval(()=>{if(state.xp>=needXP()){state.auto=false;clearInterval(autoTimer);autoTimer=null;note("Auto dừng vì tu vi đầy");render();return;}state.xp=Math.min(needXP(),state.xp+5);state.totalSeconds++;save();render();},1000);note("Bắt đầu auto");}else{clearInterval(autoTimer);autoTimer=null;note("Dừng auto");}save();render();}
function usePill(){if(state.pills<=0) return alert("Hết đan");if(state.xp>=needXP()) return alert("Đã đầy");state.pills--;state.xp=Math.min(needXP(),state.xp+Math.ceil(needXP()*0.35));note("Dùng đan dược");save();render();}
function breakthrough(){if(state.xp<needXP()) return;state.xp=0;state.breaks++;state.stones+=25;note("Đột phá!");if(state.tier<10){state.tier++;note("Đột phá "+REALMS[state.realm]+" tầng "+state.tier);}else if(state.realm<REALMS.length-1){state.realm++;state.tier=1;note("Đại cảnh giới "+REALMS[state.realm]);}else{state.tier=10;state.xp=needXP();note("Tiên Đế tối cao!");}state.hp=maxHP();save();render();}
function renderCharacter(){document.getElementById("nameInput").value=state.name;document.getElementById("charPower").textContent=power();document.getElementById("charMaxHP").textContent=maxHP();document.getElementById("wins").textContent=state.wins;document.getElementById("reputation").textContent=state.reputation;document.getElementById("realmList").innerHTML=REALMS.map((r,i)=>'<div class="card">'+(i+1)+". "+r+(i===state.realm?' <span class="badge">Hiện tại tầng '+state.tier+'</span>':'')+'</div>').join("");}
function changeName(){let n=document.getElementById("nameInput").value.trim();if(!n) return alert("Nhập tên");state.name=n.slice(0,24);note("Đổi tên "+state.name);save();render();}
function renderWorlds(){document.getElementById("worldList").innerHTML=WORLDS.map((w,i)=>'<div class="card">'+(i+1)+". "+w+' <button onclick="explore('+i+')">Khám phá</button></div>').join("");}
function explore(i){note("Khám phá "+WORLDS[i]+" +10 đá");state.stones+=10;save();render();}
let curMonster=null;function findMonster(){curMonster={...MONSTERS[Math.floor(Math.random()*MONSTERS.length)]};curMonster.curHP=curMonster.hp;document.getElementById("monsterInfo").textContent="Gặp "+curMonster.name+" HP "+curMonster.curHP;}
function attackMonster(){if(!curMonster) return findMonster();curMonster.curHP-=power();if(curMonster.curHP<=0){note("Thắng "+curMonster.name+" +20 rep");state.wins++;state.reputation+=20;state.stones+=15;curMonster=null;save();render();return;}note("Đánh "+power()+" dmg");document.getElementById("monsterInfo").textContent=curMonster.name+" còn "+curMonster.curHP;}
function useBattlePill(){state.hp=Math.min(maxHP(),state.hp+maxHP()*0.5);note("Hồi máu");save();}
function renderSects(){document.getElementById("sectList").innerHTML=SECTS.map((s,i)=>'<div class="card">'+s.name+' (bonus '+s.bonus+') '+(state.sect===i?'<span class="badge">Đã gia nhập</span>':'<button onclick="joinSect('+i+')">Gia nhập</button>')+' <button onclick="sectTask()">Làm NV</button></div>').join("");}
function joinSect(i){state.sect=i;note("Gia nhập "+SECTS[i].name);save();render();}
function sectTask(){state.stones+=50;state.reputation+=10;note("Hoàn thành NV +50 đá +10 rep");save();render();}
function renderFriends(){document.getElementById("friendList").innerHTML=NPCS.map(n=>'<div class="card">'+n.name+' - '+REALMS[n.realm]+'</div>').join("");document.getElementById("leaderboard").innerHTML="<h4>BXH</h4><div>1. "+state.name+" - tầng "+state.tier+" - lực "+power()+"</div>";}
function sendChat(){let t=document.getElementById("chatInput").value.trim();if(!t) return;document.getElementById("chatLog").innerHTML="<div><b>"+state.name+":</b> "+t+"</div>"+document.getElementById("chatLog").innerHTML;document.getElementById("chatInput").value="";}
function exportSave(){prompt("Copy save:",JSON.stringify(state));}
function resetGame(){if(confirm("Reset?")){localStorage.removeItem("tuTienSave");location.reload();}}
render();
</script>
</body>
</html>
